name: 'Audacity 4 — build aarch64 (Raspberry Pi 5)'

on:
  workflow_dispatch:
    inputs:
      audacity_ref:
        description: 'Ref Audacity do zbudowania'
        required: false
        default: 'master'
      build_mode:
        description: 'Tryb buildu'
        required: false
        default: 'nightly_build'
        type: choice
        options:
          - nightly_build
          - testing_build
          - stable_build
      lto:
        description: 'LTO'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
      create_release:
        description: 'Utwórz Release z AppImage'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: audacity-pi5
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 'Build aarch64'
    runs-on: ubuntu-24.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - name: 'Pobierz źródła Audacity'
        uses: actions/checkout@v7
        with:
          repository: audacity/audacity
          ref: ${{ github.event.inputs.audacity_ref }}
          submodules: recursive
          path: audacity

      - name: 'Ustaw flagi kompilatora'
        run: |
          OPT="-mcpu=cortex-a76 -O3 -pipe -fomit-frame-pointer"
          LDF=""
          if [ "${{ github.event.inputs.lto }}" = "on" ]; then
            OPT="$OPT -flto -fno-fat-lto-objects"
            LDF="-flto"
            echo "AR=/usr/bin/gcc-ar" >> "$GITHUB_ENV"
            echo "RANLIB=/usr/bin/gcc-ranlib" >> "$GITHUB_ENV"
          fi
          echo "CFLAGS=$OPT"   >> "$GITHUB_ENV"
          echo "CXXFLAGS=$OPT" >> "$GITHUB_ENV"
          if [ -n "$LDF" ]; then echo "LDFLAGS=$LDF" >> "$GITHUB_ENV"; fi

      - name: 'Zainstaluj zależności buildowe'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils file git lcov pkg-config software-properties-common \
            unzip p7zip-full curl libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libfreetype6 libgl1-mesa-dev libnss3-dev libpulse-dev libsndfile1-dev \
            libudev-dev make wget libcups2 libdbus-1-3 libegl1-mesa-dev libpq-dev \
            libssl-dev libxcomposite-dev libxcursor-dev libxi-dev libxkbcommon-x11-0 \
            libxrandr2 libxtst-dev libdrm-dev libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb-dev libxcb-shape0 libxkbcommon-dev libvulkan-dev \
            libjack-jackd2-dev libgtk2.0-dev gettext python3-pip uuid-dev xkb-data m4 \
            ffmpeg libavcodec-dev libavformat-dev libswscale-dev \
            ccache ninja-build cmake qemu-user-static

      - name: 'Przywróć cache ccache'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-${{ github.event.inputs.audacity_ref }}-${{ github.event.inputs.lto }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ github.event.inputs.audacity_ref }}
            ccache-${{ runner.arch }}

      - name: 'Zainstaluj Qt 6.10.1 (aarch64)'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'linux_arm64'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
          cache: true

      - name: 'Przygotuj środowisko'
        run: |
          mkdir -p "$HOME/build_tools"
          printf '%s\n' \
            '# Minimalne srodowisko build_tools' \
            > "$HOME/build_tools/environment.sh"
          chmod +x "$HOME/build_tools/environment.sh"

      - name: 'Skonfiguruj parametry buildu'
        working-directory: audacity
        run: |
          cmake -DEVENT=workflow_dispatch \
                -DBUILD_MODE=${{ github.event.inputs.build_mode }} \
                -DARTIFACT_INFO="Lin_aarch64_pi5" \
                -P buildscripts/ci/common/ci_configure.cmake

      - name: 'Buduj'
        working-directory: audacity
        run: |
          source $HOME/build_tools/environment.sh
          cmake -DCRASH_REPORT_URL="" -P buildscripts/ci/linux/ci_build.cmake

      - name: 'Pakuj (AppImage)'
        working-directory: audacity
        run: |
          source $HOME/build_tools/environment.sh
          cmake -DPACKARCH=aarch64 -P buildscripts/ci/linux/package.cmake

      - name: 'Weryfikacja AppImage'
        run: |
          APPIMAGE=$(find "$GITHUB_WORKSPACE/audacity/build.artifacts" -name '*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then echo "!! BRAK AppImage"; exit 1; fi
          file "$APPIMAGE"
          cd /tmp
          "$APPIMAGE" --appimage-extract >/dev/null 2>&1
          BIN=$(find /tmp/squashfs-root -type f -name 'audacity4portable*' -path '*bin*' -print -quit)
          [ -n "$BIN" ] || { echo "!! brak binarki"; exit 1; }
          file "$BIN"

      - name: 'Wyślij artefakt'
        uses: actions/upload-artifact@v7
        with:
          name: audacity-pi5-aarch64
          path: audacity/build.artifacts/
          retention-days: 14

      - name: 'Utwórz Release'
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pi5-${{ github.event.inputs.audacity_ref }}
          name: 'Audacity ${{ github.event.inputs.audacity_ref }} — Raspberry Pi 5 (aarch64)'
          draft: true
          files: audacity/build.artifacts/*.AppImage
